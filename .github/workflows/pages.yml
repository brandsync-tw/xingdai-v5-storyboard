name: Publish storyboard to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/assets
          cp index.html site/index.html
          cp v6.html site/v6.html
          touch site/.nojekyll
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab2f3e2/xCTh905v0SRJT21J0qmAq_bkKntxqg.png' -o 'site/assets/scene-master.png'
          test "$(wc -c < 'site/assets/scene-master.png')" -gt 10000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab2f3e1/drJqRodPkCvgQWElm4bQW_%3F%3F%3F%3F_%3F%3F%3F_%3F%3F%3F%3F%3F%3F%3F.png' -o 'site/assets/face-reference.png'
          test "$(wc -c < 'site/assets/face-reference.png')" -gt 10000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab306dc/nDEDdW6BbL3yhFylyjIe4_a_clean_modern_high_quality_brand_logo_on_a_whit.png' -o 'site/assets/optimized-logo.png'
          test "$(wc -c < 'site/assets/optimized-logo.png')" -gt 10000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab3057c/rxapB-BdP5sBagoEQh2AM_CT0hZfJp.png' -o 'site/assets/A-notes.png'
          test "$(wc -c < 'site/assets/A-notes.png')" -gt 10000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab3057c/IxVx0_utLoOyW562rfNs4_zsyGqe1U.png' -o 'site/assets/B-phone.png'
          test "$(wc -c < 'site/assets/B-phone.png')" -gt 10000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab3057c/B-K9y-LJ8UI3tiABevsib_Smlfwa6R.png' -o 'site/assets/C-stand.png'
          test "$(wc -c < 'site/assets/C-stand.png')" -gt 10000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab3057c/KGq0DFVJXLiKr9GrAgzqi_hWrd5SRY.png' -o 'site/assets/D-side.png'
          test "$(wc -c < 'site/assets/D-side.png')" -gt 10000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab31da9/sfW5msFs4hNd2AWFAEiep_video.mp4' -o 'site/assets/A-to-B-test.mp4'
          test "$(wc -c < 'site/assets/A-to-B-test.mp4')" -gt 100000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab31e3e/yyzDgfGx7-1WgfreFLJeC_video.mp4' -o 'site/assets/A-fixed-camera-test.mp4'
          test "$(wc -c < 'site/assets/A-fixed-camera-test.mp4')" -gt 100000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab31e82/vuNbL04R_OT-T6e3i80Cu_video.mp4' -o 'site/assets/B-to-C-fixed-standup.mp4'
          test "$(wc -c < 'site/assets/B-to-C-fixed-standup.mp4')" -gt 100000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab33718/8XuzhM6IPC-PTH8ApQTXE_video.mp4' -o 'site/assets/C-to-D-turn-test.mp4'
          test "$(wc -c < 'site/assets/C-to-D-turn-test.mp4')" -gt 100000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab33d2b/dapFPpGWunw_uNX5fTO3G_SIgOCS83.png' -o 'site/assets/V6-office-master.png'
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab33d30/37ItsdrgA659bnupHCCgk_lGOTJpFT.png' -o 'site/assets/V6-consultation.png'
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab33d30/ASdnanKrAfqQnj5zd3VKz_BrCxxLNB.png' -o 'site/assets/V6-tablet.png'
          test "$(wc -c < 'site/assets/V6-office-master.png')" -gt 10000
          test "$(wc -c < 'site/assets/V6-consultation.png')" -gt 10000
          test "$(wc -c < 'site/assets/V6-tablet.png')" -gt 10000
          curl --fail --location --retry 3 --silent --show-error 'https://v3b.fal.media/files/b/0ab33d41/tnEqQhh1Gw05ZlwgtLHXS_video.mp4' -o 'site/assets/V6-reference-draft-12s.mp4'
          test "$(wc -c < 'site/assets/V6-reference-draft-12s.mp4')" -gt 100000
          echo "V6 scene assets and 12-second reference draft downloaded"
      - name: Include verified complete V5 MP4
        shell: bash
        run: |
          set -euo pipefail
          test -s deliverables/XingDai_V5_Full_NoSubtitles.mp4
          cp deliverables/XingDai_V5_Full_NoSubtitles.mp4 site/assets/XingDai_V5_Full_NoSubtitles.mp4
          cp deliverables/V5-final-preview.jpg site/assets/V5-final-preview.jpg
          cp deliverables/XingDai_V6_Outdoor_Final_NoSubtitles.mp4 site/assets/XingDai_V6_Outdoor_Final_NoSubtitles.mp4
          cp deliverables/XingDai_V6_Outdoor_Preview.jpg site/assets/XingDai_V6_Outdoor_Preview.jpg
          cp deliverables/XingDai_V6_Outdoor_1080x1920_HQ_NoSubtitles.mp4 site/assets/XingDai_V6_Outdoor_1080x1920_HQ_NoSubtitles.mp4
          cp deliverables/XingDai_V6_Outdoor_1080p_Preview.jpg site/assets/XingDai_V6_Outdoor_1080p_Preview.jpg
          test "$(wc -c < site/assets/XingDai_V6_Outdoor_1080x1920_HQ_NoSubtitles.mp4)" -gt 10000000
          test "$(wc -c < site/assets/XingDai_V6_Outdoor_Final_NoSubtitles.mp4)" -gt 1000000
          test "$(wc -c < site/assets/XingDai_V5_Full_NoSubtitles.mp4)" -gt 1000000
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
