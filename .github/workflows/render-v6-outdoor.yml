name: Render V6 outdoor talking-head complete video
on:
  push:
    branches: [main]
    paths: ['.github/workflows/render-v6-outdoor.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download approved outdoor speaking clips
        run: |
          set -euo pipefail
          mkdir -p work/cuts deliverables
          curl --fail --location --retry 5 --retry-delay 2 --silent --show-error 'https://v3b.fal.media/files/b/0ab33dd5/lxM1Hc0amxxaRVDIu6z3-_1sxbUDhT.mp4' -o work/main.mp4
          curl --fail --location --retry 5 --retry-delay 2 --silent --show-error 'https://v3b.fal.media/files/b/0ab33ddc/uMlfO3zYRwQaplPDW-Vfz_vAE9TJpt.mp4' -o work/angle_b.mp4
          curl --fail --location --retry 5 --retry-delay 2 --silent --show-error 'https://v3b.fal.media/files/b/0ab33dde/NTWH1md-gDz7h-Wyp4-yp_6806IyUK.mp4' -o work/angle_c.mp4
          curl --fail --location --retry 5 --retry-delay 2 --silent --show-error 'https://v3b.fal.media/files/b/0ab306dc/nDEDdW6BbL3yhFylyjIe4_a_clean_modern_high_quality_brand_logo_on_a_whit.png' -o work/logo.png
          for p in work/main.mp4 work/angle_b.mp4 work/angle_c.mp4; do
            test "$(wc -c < "$p")" -gt 100000
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$p"
          done
          test -s deliverables/V6_original_Gemini_voice.wav
      - name: Normalize and edit
        run: |
          set -euo pipefail
          # Exact cut positions: 261 + 234 + 178 + 62 = 735 frames at 24 fps.
          # Use the original narration audio only; AI clip audio is discarded.
          ffmpeg -hide_banner -loglevel error -y -i work/main.mp4 \
            -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fps=24,setsar=1,format=yuv420p" \
            -frames:v 261 -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -video_track_timescale 12288 work/cuts/01.mp4
          ffmpeg -hide_banner -loglevel error -y -i work/angle_b.mp4 \
            -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fps=24,setsar=1,format=yuv420p,tpad=stop_mode=clone:stop_duration=0.2" \
            -frames:v 234 -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -video_track_timescale 12288 work/cuts/02.mp4
          ffmpeg -hide_banner -loglevel error -y -i work/angle_c.mp4 \
            -vf "scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,fps=24,setsar=1,format=yuv420p,tpad=stop_mode=clone:stop_duration=0.3" \
            -frames:v 178 -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -video_track_timescale 12288 work/cuts/03.mp4
          ffmpeg -hide_banner -loglevel error -y -loop 1 -i work/logo.png \
            -vf "scale=650:650:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:color=0xfffcf8,fps=24,format=yuv420p,fade=t=in:st=0:d=0.35" \
            -frames:v 62 -an -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p -video_track_timescale 12288 work/cuts/04.mp4
          printf "file '01.mp4'\nfile '02.mp4'\nfile '03.mp4'\nfile '04.mp4'\n" > work/cuts/list.txt
          (cd work/cuts && ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i list.txt -c copy ../silent.mp4)
          ffmpeg -hide_banner -loglevel error -y -i work/silent.mp4 -i deliverables/V6_original_Gemini_voice.wav \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -ar 48000 \
            -t 30.64 -movflags +faststart deliverables/XingDai_V6_Outdoor_Final_NoSubtitles.mp4
          ffmpeg -hide_banner -loglevel error -y -ss 2 -i deliverables/XingDai_V6_Outdoor_Final_NoSubtitles.mp4 \
            -frames:v 1 -q:v 3 deliverables/XingDai_V6_Outdoor_Preview.jpg
      - name: Verify final delivery
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess,os
          path='deliverables/XingDai_V6_Outdoor_Final_NoSubtitles.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',path]))
          duration=float(d['format']['duration'])
          v=[x for x in d['streams'] if x['codec_type']=='video']
          a=[x for x in d['streams'] if x['codec_type']=='audio']
          assert 30.55<=duration<=30.75, duration
          assert len(v)==1 and len(a)==1
          assert (v[0]['width'],v[0]['height'])==(720,1280)
          assert os.path.getsize(path)>1000000
          print('VERIFIED',path,duration,os.path.getsize(path))
          PY
          ffmpeg -hide_banner -loglevel error -i deliverables/XingDai_V6_Outdoor_Final_NoSubtitles.mp4 -f null - </dev/null
      - name: Publish final MP4
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/XingDai_V6_Outdoor_Final_NoSubtitles.mp4 deliverables/XingDai_V6_Outdoor_Preview.jpg
          git commit -m "Deliver complete 30.64s V6 outdoor talking-head video with original Gemini narration" || exit 0
          git push origin HEAD:main
